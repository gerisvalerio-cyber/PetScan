<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PetScan 🐾</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:Arial,sans-serif;background:#fff7fb;color:#2b2230}
  .wrap{max-width:720px;margin:auto;padding:24px 16px 40px}
  h1{text-align:center;margin:8px 0 6px;font-size:34px}
  .sub{text-align:center;color:#6d6170;margin:0 0 22px}
  .card{background:white;border-radius:22px;padding:20px;box-shadow:0 5px 22px #00000012;margin-bottom:16px}
  label{display:block;font-weight:700;margin-bottom:8px}
  input[type=file]{width:100%;padding:12px;border:2px dashed #d8c6d5;border-radius:14px;background:#fff}
  #preview{display:none;width:100%;max-height:380px;object-fit:contain;border-radius:18px;margin-top:16px;background:#f7f2f6}
  button{width:100%;border:0;border-radius:15px;padding:16px;font-size:18px;font-weight:700;cursor:pointer;background:#7b4aa5;color:white;margin-top:16px}
  button:disabled{opacity:.55}
  #estado{display:none;margin-top:14px;padding:12px;border-radius:12px;background:#f3edf7}
  #resultado{display:none}
  .badge{display:inline-block;background:#eee3f7;padding:7px 11px;border-radius:999px;font-size:13px;font-weight:700}
  .result-title{text-align:center;font-size:27px;margin:12px 0 18px}
  .item{padding:12px 0;border-bottom:1px solid #eee}
  .note{font-size:13px;color:#746b75;line-height:1.45}
  .small{font-size:12px;color:#887e88;margin-top:12px;line-height:1.4}
  .ok{background:#edf8ef!important}
  .err{background:#fff0f0!important}
</style>
</head>
<body>
<div class="wrap">
  <h1>🐾 PetScan</h1>
  <p class="sub">Identificador de razas de perros con IA</p>

  <div class="card">
    <label for="foto">Selecciona una foto de tu perro</label>
    <input id="foto" type="file" accept="image/*">
    <img id="preview" alt="Vista previa">
    <button id="analizarBtn" disabled>🤖 Reconocer raza automáticamente</button>
    <div id="estado"></div>
  </div>

  <div id="resultado" class="card"></div>
</div>

<script type="module">
import { Client, handle_file } from "https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js";

const API_BASE = "https://thathungarian-barkid.hf.space";

const foto = document.getElementById("foto");
const preview = document.getElementById("preview");
const btn = document.getElementById("analizarBtn");
const estado = document.getElementById("estado");
const resultado = document.getElementById("resultado");

const razas = {
  "pug": {
    nombre:"Pug", vida:"12–15 años", tamano:"Pequeño",
    caracteristicas:"Perro pequeño, compacto y de hocico corto. Suele ser sociable y afectuoso.",
    cuidados:"Necesita ejercicio moderado, vigilancia en climas calurosos y cuidado de sus pliegues."
  },
  "labrador retriever": {
    nombre:"Labrador Retriever", vida:"10–12 años", tamano:"Mediano-grande",
    caracteristicas:"Perro activo, sociable e inteligente.",
    cuidados:"Requiere actividad física regular, estimulación mental y control de peso."
  },
  "german shepherd": {
    nombre:"Pastor Alemán", vida:"9–13 años", tamano:"Grande",
    caracteristicas:"Perro atlético, inteligente y de trabajo.",
    cuidados:"Necesita ejercicio, entrenamiento y revisiones veterinarias."
  },
  "chihuahua": {
    nombre:"Chihuahua", vida:"12–20 años", tamano:"Muy pequeño",
    caracteristicas:"Raza de tamaño muy pequeño, alerta y activa.",
    cuidados:"Protección frente al frío, actividad adecuada y atención dental."
  },
  "french bulldog": {
    nombre:"Bulldog Francés", vida:"10–12 años", tamano:"Pequeño",
    caracteristicas:"Perro compacto y de hocico corto.",
    cuidados:"Evitar sobrecalentamiento y ejercicio intenso; mantener un peso saludable."
  },
  "golden retriever": {
    nombre:"Golden Retriever", vida:"10–12 años", tamano:"Grande",
    caracteristicas:"Perro activo, sociable e inteligente.",
    cuidados:"Ejercicio diario, cepillado y estimulación mental."
  },
  "beagle": {
    nombre:"Beagle", vida:"10–15 años", tamano:"Mediano",
    caracteristicas:"Perro activo, curioso y con un olfato muy desarrollado.",
    cuidados:"Necesita paseos, estimulación mental y control de peso."
  }
};

function normalizar(t){
  return String(t ?? "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\\u0300-\\u036f]/g,"")
    .replace(/[-_]/g," ")
    .trim();
}

function datosDeRaza(nombre){
  const n = normalizar(nombre);
  const alias = {
    "labrador":"labrador retriever",
    "german shepherd dog":"german shepherd",
    "pastor aleman":"german shepherd",
    "pastor aleman":"german shepherd",
    "french bulldog":"french bulldog",
    "bulldog frances":"french bulldog",
    "golden":"golden retriever"
  };
  return razas[alias[n] || n] || null;
}

function extraerTexto(obj, out=[]){
  if(obj == null) return out;
  if(typeof obj === "string") { out.push(obj); return out; }
  if(Array.isArray(obj)){ for(const x of obj) extraerTexto(x,out); return out; }
  if(typeof obj === "object"){
    for(const [k,v] of Object.entries(obj)){
      if(["label","class","name","prediction","text","value"].includes(k) && typeof v === "string") out.push(v);
      else extraerTexto(v,out);
    }
  }
  return out;
}

function extraerRaza(data){
  const textos = extraerTexto(data);
  const todo = normalizar(JSON.stringify(data));

  // Primero buscamos las razas que PetScan tiene con información.
  for(const key of Object.keys(razas)){
    if(todo.includes(normalizar(key))) return razas[key].nombre;
  }
  for(const [alias, key] of Object.entries({
    "labrador":"labrador retriever",
    "pastor aleman":"german shepherd",
    "german shepherd dog":"german shepherd",
    "bulldog frances":"french bulldog",
    "golden":"golden retriever"
  })){
    if(todo.includes(alias)) return razas[key].nombre;
  }

  // Si la IA devuelve una etiqueta que no está en la lista local.
  const posible = textos.find(x => x && x.length < 100 && /[a-záéíóúñ]/i.test(x));
  return posible || null;
}

function mostrarEstado(texto, ok=false, error=false){
  estado.style.display="block";
  estado.className = error ? "err" : (ok ? "ok" : "");
  estado.textContent = (ok ? "✅ " : error ? "⚠️ " : "⌛ ") + texto;
}

function mostrarResultado(raza, raw=null){
  const d = datosDeRaza(raza);
  resultado.style.display="block";
  resultado.innerHTML = `
    <span class="badge">Resultado de IA</span>
    <div class="result-title">🐶 ${raza || "Raza no identificada"}</div>
    ${d ? `
      <div class="item"><b>⌛ Esperanza de vida:</b> ${d.vida}</div>
      <div class="item"><b>📏 Tamaño:</b> ${d.tamano}</div>
      <div class="item"><b>⭐ Características:</b> ${d.caracteristicas}</div>
      <div class="item"><b>🩺 Cuidados:</b> ${d.cuidados}</div>
    ` : `
      <div class="item"><b>ℹ️ Información:</b> La IA identificó esta etiqueta. PetScan todavía no tiene una ficha ampliada para esta raza.</div>
    `}
    <p class="note">La identificación automática es orientativa y puede equivocarse, especialmente si la foto no muestra claramente al perro.</p>
  `;
}

foto.addEventListener("change", () => {
  const file = foto.files?.[0];
  resultado.style.display="none";
  estado.style.display="none";
  if(!file){
    preview.style.display="none";
    btn.disabled=true;
    return;
  }
  preview.src = URL.createObjectURL(file);
  preview.style.display="block";
  btn.disabled=false;
});

let cliente = null;
let endpoint = null;

async function conectarBarkID(){
  if(cliente && endpoint) return;
  mostrarEstado("Conectando con BarkID…");
  cliente = await Client.connect(API_BASE, {
    status_callback: (s) => {
      if(s?.status === "sleeping") mostrarEstado("Despertando BarkID…");
    }
  });

  const info = await cliente.view_api();
  const endpoints = Object.entries(info?.named_endpoints || {});
  if(!endpoints.length) throw new Error("BarkID no mostró endpoints de API.");

  // Elegimos el endpoint que recibe una imagen/archivo.
  let elegido = endpoints.find(([name, ep]) => {
    const p = ep?.parameters || [];
    return p.length >= 1 && /image|file/i.test(JSON.stringify(p[0]));
  });

  if(!elegido) elegido = endpoints.find(([name]) => /predict|classif|infer|analy/i.test(name));
  if(!elegido) elegido = endpoints[0];

  endpoint = elegido[0];
}

async function analizarBarkID(file){
  await conectarBarkID();
  const entrada = await handle_file(file);
  const respuesta = await cliente.predict(endpoint, [entrada]);
  const raza = extraerRaza(respuesta?.data ?? respuesta);
  if(!raza) throw new Error("BarkID respondió, pero no se pudo leer la raza.");
  return raza;
}

btn.addEventListener("click", async () => {
  const file = foto.files?.[0];
  if(!file){
    alert("Primero selecciona una foto.");
    return;
  }

  btn.disabled=true;
  resultado.style.display="none";

  try{
    const raza = await analizarBarkID(file);
    mostrarEstado("Raza identificada correctamente.", true);
    mostrarResultado(raza);
  }catch(error){
    console.error(error);
    mostrarEstado(
      "No se pudo completar el análisis. BarkID puede estar dormido, ocupado o haber cambiado su API.",
      false,
      true
    );
    resultado.style.display="block";
    resultado.innerHTML = `
      <span class="badge">PetScan</span>
      <div class="result-title">⚠️ No se pudo analizar la foto</div>
      <p>Intenta nuevamente en unos segundos. Si BarkID está disponible, PetScan se conectará automáticamente.</p>
    `;
  }finally{
    btn.disabled=false;
  }
});
</script>
</body>
</html>
